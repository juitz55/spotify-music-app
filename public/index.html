<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Spotify Music Player</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1DB954">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="app-container">

    <aside class="sidebar">
      <div class="brand">
        <i class="fa-brands fa-spotify brand-icon"></i>
        <span class="brand-name">Spotify<span class="brand-sub">Offline</span></span>
      </div>

      <nav class="nav-menu">
        <button class="nav-item active" id="nav-home">
          <i class="fa-solid fa-house"></i> Startseite
        </button>
        <button class="nav-item" id="nav-offline">
          <i class="fa-solid fa-circle-down"></i> Offline Musik <span class="badge" id="offline-count-badge">0</span>
        </button>
      </nav>

      <div class="sidebar-divider"></div>

      <div class="sidebar-actions">
        <button class="btn btn-primary btn-full" id="open-upload-btn">
          <i class="fa-solid fa-plus"></i> Song Hochladen
        </button>
      </div>

      <div class="network-status-box" id="network-status">
        <div class="status-indicator online" id="status-dot"></div>
        <span id="status-text">Online</span>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>
          <input type="text" id="search-input" placeholder="Titel, Künstler oder Album suchen...">
        </div>
        <div class="topbar-right">
          <button class="filter-chip" id="filter-offline-only">
            <i class="fa-solid fa-download"></i> Nur Offline
          </button>
        </div>
      </header>

      <!-- Add Music Section -->
      <section class="add-music-section">
        <div class="add-music-tabs">
          <button class="tab-btn active" id="tab-youtube">
            <i class="fa-brands fa-youtube"></i> YouTube Link
          </button>
          <button class="tab-btn" id="tab-upload">
            <i class="fa-solid fa-file-audio"></i> MP3 Datei
          </button>
        </div>

        <!-- YouTube Tab -->
        <div class="tab-content active" id="content-youtube">
          <div class="youtube-import-box">
            <div class="yt-input-wrapper">
              <i class="fa-brands fa-youtube yt-icon"></i>
              <input type="text" id="yt-url-input" placeholder="https://youtu.be/... oder https://youtube.com/watch?v=...">
            </div>
            <button class="btn btn-red" id="yt-import-btn">
              <i class="fa-solid fa-cloud-arrow-down"></i> Importieren
            </button>
          </div>
          <div id="yt-status-message" class="yt-status"></div>
          <div class="yt-info-box" id="yt-info-box" style="display:none;">
            <img id="yt-thumb" src="" alt="Cover">
            <div class="yt-info-details">
              <strong id="yt-title-preview"></strong>
              <span id="yt-artist-preview"></span>
            </div>
            <div class="yt-info-actions">
              <button class="btn btn-primary btn-sm" id="yt-confirm-save">
                <i class="fa-solid fa-floppy-disk"></i> Speichern
              </button>
            </div>
          </div>
        </div>

        <!-- Upload Tab -->
        <div class="tab-content" id="content-upload">
          <form id="upload-form-inline">
            <div class="upload-grid">
              <div class="form-group">
                <label>Titel *</label>
                <input type="text" id="ul-title" placeholder="Song Titel" required>
              </div>
              <div class="form-group">
                <label>Künstler *</label>
                <input type="text" id="ul-artist" placeholder="Künstler" required>
              </div>
              <div class="form-group">
                <label>Album</label>
                <input type="text" id="ul-album" placeholder="Album (optional)">
              </div>
              <div class="form-group">
                <label>MP3 Datei *</label>
                <input type="file" id="ul-audio" accept="audio/*" required>
              </div>
              <div class="form-group">
                <label>Cover Bild</label>
                <input type="file" id="ul-cover" accept="image/*">
              </div>
            </div>
            <button type="submit" class="btn btn-primary" id="ul-submit-btn">
              <i class="fa-solid fa-upload"></i> Hochladen
            </button>
          </form>
        </div>
      </section>

      <!-- Track List Section -->
      <section class="track-section">
        <div class="section-header">
          <h2>Meine Bibliothek</h2>
          <span class="track-count" id="track-count-text">0 Titel</span>
        </div>
        <div class="track-list" id="track-list-container">
          <div class="loading-state"><i class="fa-solid fa-spinner fa-spin"></i> Lade...</div>
        </div>
      </section>
    </main>

    <!-- Player Bar -->
    <footer class="player-bar">
      <div class="player-left">
        <div class="cover-wrapper">
          <img src="/uploads/covers/default.jpg" id="player-cover" alt="Cover">
        </div>
        <div class="song-details">
          <span class="song-title" id="player-title">Kein Song ausgewählt</span>
          <span class="song-artist" id="player-artist">Drücke Play</span>
        </div>
        <button class="btn-icon downloaded" id="player-offline-badge" title="Offline Status">
          <i class="fa-regular fa-circle-check"></i>
        </button>
      </div>

      <div class="player-center">
        <div class="player-controls">
          <button class="btn-control" id="btn-shuffle"><i class="fa-solid fa-shuffle"></i></button>
          <button class="btn-control" id="btn-prev"><i class="fa-solid fa-backward-step"></i></button>
          <button class="btn-control btn-play" id="btn-play-pause"><i class="fa-solid fa-play"></i></button>
          <button class="btn-control" id="btn-next"><i class="fa-solid fa-forward-step"></i></button>
          <button class="btn-control" id="btn-repeat"><i class="fa-solid fa-repeat"></i></button>
        </div>
        <div class="player-progress">
          <span class="time-text" id="time-current">0:00</span>
          <div class="progress-bar-container" id="seek-bar">
            <div class="progress-bar-fill" id="seek-fill"></div>
          </div>
          <span class="time-text" id="time-total">0:00</span>
        </div>
      </div>

      <div class="player-right">
        <button class="btn-icon" id="player-download-btn" title="Offline speichern">
          <i class="fa-solid fa-arrow-down-to-line"></i>
        </button>
        <div class="volume-container">
          <i class="fa-solid fa-volume-high" id="volume-icon"></i>
          <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8">
        </div>
      </div>
    </footer>
  </div>

  <audio id="audio-engine" preload="metadata"></audio>
  <script src="/app.js"></script>
</body>
</html>
